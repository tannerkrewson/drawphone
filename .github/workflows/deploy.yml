name: Build deployment image off-host

on:
    push:
        branches:
            - prod
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: drawphone-offhost-image
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - name: Install Podman
              run: |
                  if ! command -v podman >/dev/null; then
                      sudo apt-get update
                      sudo apt-get install -y podman
                  fi
            - name: Build committed source with the pinned herokuish image
              run: bash scripts/build-image.sh "$RUNNER_TEMP/drawphone-image"
            - uses: actions/upload-artifact@v4
              with:
                  name: drawphone-image-${{ github.sha }}
                  path: ${{ runner.temp }}/drawphone-image/
                  compression-level: 0
                  retention-days: 7

# Intentionally no git push/SSH/deployment step: the shared production host must
# never compile the application. Download the artifact and run deploy-image.sh
# from an authorized admin machine only during the coordinator's exclusive slot.
