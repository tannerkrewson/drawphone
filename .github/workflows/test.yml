name: CI and GitHub Pages

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run format
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - uses: actions/upload-pages-artifact@v5
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DRAWPHONE_PAGES_ENABLED == 'true'
              with:
                  path: dist

    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DRAWPHONE_PAGES_ENABLED == 'true'
        needs: build
        runs-on: ubuntu-latest
        concurrency: github-pages
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v5
              id: deployment
